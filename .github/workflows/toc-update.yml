name: Update TOC Interface version(s)

on:
  schedule:
    - cron: 44 12 * * *
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Clone project
        uses: actions/checkout@v7
      - name: Update TOC Interface version
        uses: p3lim/toc-interface-updater@v4
        with:
          beta: true
          ptr: true
          flavor: |
            retail
            forever
      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          title: Update Interface version
          commit-message: Update Interface version
          branch: interface-version
          delete-branch: true

  # The legacy branch (Classic flavors): scheduled workflows only run from the
  # default branch, so its update lives here.
  legacy:
    runs-on: ubuntu-latest
    steps:
      - name: Clone legacy branch
        uses: actions/checkout@v7
        with:
          ref: legacy
      - name: Update TOC Interface version
        uses: p3lim/toc-interface-updater@v4
        with:
          flavor: |
            vanilla
            tbc
            mists
      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          base: legacy
          title: Update Interface version (legacy)
          commit-message: Update Interface version
          branch: interface-version-legacy
          delete-branch: true
